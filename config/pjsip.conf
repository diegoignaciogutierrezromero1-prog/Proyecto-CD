[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_client=no
verify_server=no

; --- Extension 101 ---
[101]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
transport=transport-tls
media_encryption=sdes
auth=auth101
aors=101

[auth101]
type=auth
auth_type=userpass
password=ClaveSuperSegura101
username=101

[101]
type=aor
max_contacts=1

; --- Extension 102 ---
[102]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
transport=transport-tls
media_encryption=sdes
auth=auth102
aors=102

[auth102]
type=auth
auth_type=userpass
password=ClaveSuperSegura102
username=102

[102]
type=aor
max_contacts=1
